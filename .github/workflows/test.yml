# Run the end-to-end tests on macOS, Windows, and Linux for every pull request. The failed tests'
# artifacts are uploaded as test-results-<OS>.
#
# Requires a committed package-lock.json (npm ci).
name: Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      # One platform failing should not cancel the others.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      # Ubuntu 24.04 denies the user namespaces the Chromium sandbox needs.
      - name: Allow the Chromium sandbox
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ runner.os }}
          path: build/test-results/
          if-no-files-found: ignore
