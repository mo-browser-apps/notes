syntax = "proto3";

import "google/protobuf/empty.proto";

message SetThemeRequest {
  string theme = 1;
}

// The app's identity from mobrowser.conf.json, for Settings → About.
message AppInfo {
  string name = 1;
  string version = 2;
  string description = 3;
  string copyright = 4;
  // e.g. "Apple Silicon", "Intel", "64-bit"; empty when unknown.
  string architecture = 5;
}

message OpenSettingsRequest {
  // "general", "import-export" or "about".
  string section = 1;
}

service AppService {
  rpc SetTheme(SetThemeRequest) returns (google.protobuf.Empty);
  rpc GetAppInfo(google.protobuf.Empty) returns (AppInfo);
  // Opens the Settings window (or focuses it) on the given section.
  rpc OpenSettings(OpenSettingsRequest) returns (google.protobuf.Empty);
}

// The notes window's own caption buttons on Windows, where the native titlebar
// (and with it the native buttons) is hidden.
message WindowActionRequest {
  // "minimize", "toggle-maximize" or "close".
  string action = 1;
}

message WindowState {
  bool maximized = 1;
}

service WindowService {
  rpc Act(WindowActionRequest) returns (google.protobuf.Empty);
  rpc GetState(google.protobuf.Empty) returns (WindowState);
  // Every change, including ones the user makes outside the buttons
  // (double-clicking the toolbar, Win+Up, Aero Snap).
  rpc OnState(google.protobuf.Empty) returns (stream WindowState);
}
